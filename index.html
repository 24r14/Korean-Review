<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A collaborative Korean review notebook for KLEAR learners.">
  <title>복습장 · Korean Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div>
      <div class="brand">복습장</div>
      <div class="brand-sub">Korean review notebook</div>
    </div>
    <div class="sync-status" id="syncStatus">Loading shared library…</div>
    <nav class="nav-list" id="lessonList" aria-label="Lessons"></nav>
    <div class="sidebar-actions">
      <button class="btn subtle" id="addLessonBtn">+ Personal lesson</button>
      <button class="btn subtle" id="importBtn">Import</button>
      <button class="btn subtle" id="appearanceBtn">Appearance</button>
      <button class="btn subtle" id="settingsBtn">Advanced</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Today</h1>
        <div class="muted" id="pageSubtitle">A small plan for your next Korean study session.</div>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="globalSearchBtn">⌕ Search</button>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-view="today">Today</button>
      <button class="tab" data-view="learn">Learn basics</button>
      <button class="tab" data-view="browse">Browse</button>
      <button class="tab" data-view="review">Flashcards</button>
      <button class="tab" data-view="quiz">Quiz</button>
    </div>

    <div id="banner"></div>

    <section class="view active" id="view-today"></section>
    <section class="view" id="view-learn"></section>
    <section class="view" id="view-browse"></section>
    <section class="view" id="view-review"></section>
    <section class="view" id="view-quiz"></section>
  </main>
</div>

<div class="modal-bg" id="modalBg" aria-hidden="true">
  <div class="modal" id="modal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
