<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Korean learning and review workspace for KLEAR learners.">
  <title>복습장 · Korean Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="enhancements.css">
  <link rel="stylesheet" href="explore.css">
  <link rel="stylesheet" href="product-upgrades.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div>
      <div class="brand">복습장</div>
      <div class="brand-sub">Korean learning workspace</div>
    </div>
    <div class="sync-status" id="syncStatus">Loading course content…</div>
    <div class="side-label">Lessons</div>
    <nav class="nav-list" id="lessonList" aria-label="Lessons"></nav>
    <div class="sidebar-actions">
      <button class="btn subtle" id="appearanceBtn">Appearance</button>
      <button class="btn subtle" id="globalSearchBtn">Search</button>
      <button class="btn subtle" id="importBtn">Import</button>
      <button class="btn subtle" id="feedbackBtn">Feedback</button>
      <button class="btn subtle wide" id="settingsBtn">Advanced</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Today</h1>
        <div class="muted" id="pageSubtitle">A small plan for your next Korean study session.</div>
      </div>
      <div class="top-actions">
        <span class="streak" id="streakBadge">0 day streak</span>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-view="today">Today</button>
      <button class="tab" data-view="lesson">Lesson</button>
      <button class="tab" data-view="browse">Browse</button>
      <button class="tab" data-view="practice">Practice</button>
      <button class="tab" data-view="review">Flashcards</button>
      <button class="tab" data-view="quiz">Quiz</button>
      <button class="tab" data-view="mistakes">Mistakes</button>
      <button class="tab" data-view="basics">Beginner</button>
      <button class="tab" data-view="explore">Explore</button>
    </div>

    <div id="banner"></div>
    <section class="view active" id="view-today"></section>
    <section class="view" id="view-lesson"></section>
    <section class="view" id="view-browse"></section>
    <section class="view" id="view-practice"></section>
    <section class="view" id="view-review"></section>
    <section class="view" id="view-quiz"></section>
    <section class="view" id="view-mistakes"></section>
    <section class="view" id="view-basics"></section>
    <section class="view" id="view-explore"></section>
  </main>
</div>

<div class="modal-bg" id="modalBg" aria-hidden="true"><div class="modal" id="modal"></div></div>
<script src="app.js"></script>
<script src="enhancements.js"></script>
<script src="explore.js"></script>
<script src="product-upgrades.js"></script>
</body>
</html>
